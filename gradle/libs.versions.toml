[versions]
# AGP 9.0.1 + Gradle 9.6.1（wrapper 里那个），配套 compileSdk 37。
#
# 为什么非要 compileSdk 37：alm 的滚轮选择器要用 miuix 的 NumberPicker，而 miuix 传递
# 依赖 miuix-shader，其 AAR 元数据写着 minCompileSdk=37；它被 squircle 硬引用，排不掉。
# 而 AGP 8.13.2 官方只支持到 compileSdk 36.1 —— 升 AGP 9 是为了踩在官方支持范围内，
# 而不是挂着 suppressUnsupportedCompileSdk 硬上。版本与 LoveScore 对齐。
#
# AGP 9 的迁移点（都已处理，别再踩一遍）：`org.jetbrains.kotlin.android` 插件不再允许
# 显式声明（Kotlin 支持已内置，compose 插件仍要显式加）；旧 Variant API
# `applicationVariants` 及其实现类被移除，APK 改名改走独立 Task + finalizedBy。
agp = "9.0.1"
androidxCoreKtx = "1.15.0"
appcompatVersion = "1.7.0"
coreKtxVersion = "1.15.0"
fragmentKtx = "1.8.5"
glide = "4.16.0"
googleMaterial = "1.11.0"
gson = "2.10.1"
immersionbar = "3.2.2"
immersionbarVersion = "3.2.2"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"
constraintlayout = "2.2.0"
materialVersion = "1.12.0"
navigationFragment = "2.8.5"
xxpermissions = "20.0"
kotlin = "2.3.21"
coreKtx = "1.15.0"
xxpermissionsVersion = "20.0"
lifecycle = "2.8.7"
# 液态玻璃（iOS 26 风格毛玻璃）。要求 Kotlin ≥ 2.3.21 + Compose Multiplatform 1.10.3
# （Android 侧映射到 androidx compose 1.10.x），因此本项目的 Kotlin/AGP/compileSdk/BOM 四条轴
# 是按它反推上来的，不要单独回退其中任意一条。
liquidGlass = "0.2.3"
# miuix（HyperOS 风格 KMP 组件库）。只为它的 NumberPicker —— 滚轮选择器
# （拖动跟手、松手吸附、跨格轻震、离选中线越远越小越淡）自己实现不划算。
# 来源是 LoveScore 的 ui/ds/DsWheelPicker.kt，两边共用同一套封装。
miuix = "0.9.3"
composeBom = "2026.02.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"

[libraries]
appcompat-v161 = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
core-ktx-v1101 = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
core-ktx-v1150 = { module = "androidx.core:core-ktx", version.ref = "coreKtxVersion" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
getactivity-xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissionsVersion" }
geyifeng-immersionbar = { module = "com.geyifeng.immersionbar:immersionbar", version.ref = "immersionbarVersion" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
immersionbar = { module = "com.gyf.immersionbar:immersionbar", version.ref = "immersionbar" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material-v1110 = { module = "com.google.android.material:material", version.ref = "googleMaterial" }
material-v190 = { module = "com.google.android.material:material", version.ref = "materialVersion" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
xxpermissions = { module = "com.hjq:xxpermissions", version.ref = "xxpermissions" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# ---- Jetpack Compose (BOM 统一管理 compose 各构件版本，下面几个不带 version) ----
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
liquid-glass = { module = "io.github.nadeemiqbal:liquid-glass", version.ref = "liquidGlass" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

